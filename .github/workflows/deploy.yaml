name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

  workflow_dispatch:
    inputs:

permissions:
  contents: read

# Keep a deployment and its PDS sync together before starting the next run.
concurrency:
  group: pages-and-pds
  cancel-in-progress: false

jobs:
  build_site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate published post records
        run: node scripts/create-document.ts --all

      - name: Replace Image Urls in Markdown
        run: bash ./replaceMdImageUrls.sh

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: pnpm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  publish_posts:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish post records to PDS
        env:
          ATPROTO_SERVICE: ${{ secrets.ATPROTO_SERVICE }}
          ATPROTO_IDENTIFIER: ${{ secrets.ATPROTO_IDENTIFIER }}
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: node scripts/create-document.ts --all --publish
